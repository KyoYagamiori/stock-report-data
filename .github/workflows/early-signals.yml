name: Early BOLL discovery

on:
  push:
    branches: [main]
    paths:
      - "market_screen/early*.py"
      - "config/early_signals.json"
      - "tests/test_boll_early*.py"
      - ".github/workflows/early-signals.yml"
  workflow_dispatch:
  schedule:
    # Best effort polling. Actual quote age is checked independently.
    - cron: "*/5 1-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: early-boll-main
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /market_screen/
            /research_system/
            /report_support/
            /pipeline/
            /tests/
            /config/
            /schemas/
            /requirements.txt
            /output/cache/trade_calendar.json
            /output/boll/latest/
            /output/boll/bootstrap/
            /output/early/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check early discovery contracts
        run: python -m unittest discover -s tests -p 'test_boll_early*.py'
      - name: Hydrate current immutable daily and membership evidence
        run: python -m market_screen.workflow_io hydrate --phase early
      - name: Discover current early opportunities without history downloads
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            python -m market_screen.early_runtime
          else
            python -m market_screen.early_runtime --allow-closed
          fi
      - name: Publish measured coverage and original observation windows
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse output/early
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: publish early BOLL discovery and measured latency"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1

name: Historical daily model pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research_system/history_*.py"
      - "config/history_training.json"
      - "requirements-history.txt"
      - ".github/workflows/history-training.yml"

permissions:
  contents: write

concurrency:
  group: historical-daily-model-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research_system/
            /market_screen/
            /pipeline/
            /report_support/
            /tests/
            /config/
            /requirements*.txt
            /output/history_pilot/
            /output/research/latest/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install historical research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-research.txt -r requirements-history.txt
      - name: Test historical source, timing and outcome contracts
        run: python -m unittest tests.test_research_history tests.test_research_history_qlib tests.test_research_early_model tests.test_research_model
      - name: Acquire immutable public history, build samples and fit pilot
        run: timeout 900 python -u -m research_system.history_training
      - name: Preserve historical evidence without replacing other research state
        if: always()
        shell: bash
        run: |
          if [ ! -f output/research/latest/history_pilot_status.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add --sparse output/history_pilot output/research/latest/history_pilot_status.json
            if [ -f output/research/latest/history_price_crosscheck.json ]; then git add --sparse output/research/latest/history_price_crosscheck.json; fi
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "research: preserve historical pilot evidence and actual training status"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
      - name: Verify actual model completion separately from workflow publication
        run: |
          python -c 'import json; from pathlib import Path; d=json.loads(Path("output/research/latest/history_pilot_status.json").read_text()); print(d); raise SystemExit(0 if d.get("model_status")=="trained_pilot_only" else 1)'

name: Validate BOLL proposal on review branch

on:
  push:
    branches: [codex/full-market-boll-20261015]
    paths:
      - "market_screen/**"
      - "config/boll_*.json"
      - "tests/test_boll_*.py"
      - ".github/workflows/boll-screen-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boll-review-branch-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/codex/full-market-boll-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-market-boll-20261015
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify calculation, cache and time gates
        run: python -m unittest discover -s tests -p "test_boll_*.py"
      - name: Restore review cache
        uses: actions/cache/restore@v4
        with:
          path: output/boll/state/history
          key: boll-review-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            boll-review-v1-
      - name: Run first full-market data validation
        id: screen
        continue-on-error: true
        timeout-minutes: 45
        run: python -m market_screen.runner --phase auto --max-seconds 2400
      - name: Preserve review cache
        if: always() && steps.screen.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: output/boll/state/history
          key: boll-review-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish results only on the review branch
        if: always() && steps.screen.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/boll
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "boll review: preserve actual full-market validation"
          for attempt in 1 2 3; do
            git pull --rebase origin codex/full-market-boll-20261015
            if git push origin HEAD:codex/full-market-boll-20261015; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Require full coverage for successful validation
        if: always() && steps.screen.outcome == 'failure'
        run: |
          echo "::error::Review data remains partial; inspect retained coverage and errors. Default main branch was not modified."
          exit 1

name: Maintain public report index

on:
  push:
    branches: [main]
    paths:
      - "reports/archive/**.md"
      - "reports/archive/**-handoff.json"
      - "report_support/__init__.py"
      - "report_support/index.py"
      - "report_support/delivery.py"
      - "tests/test_report_index.py"
      - "tests/test_report_delivery.py"
      - ".github/workflows/report-index.yml"
  workflow_dispatch:
  schedule:
    # Recover an orphaned archive even if its original push job was interrupted.
    - cron: "25 1,5,13 * * *"

permissions:
  contents: write

concurrency:
  group: public-report-index-main
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /reports/archive/
            /reports/latest/
            /report_support/
            /tests/__init__.py
            /tests/test_report_index.py
            /tests/test_report_delivery.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify archive and recovery contracts
        run: python -m unittest tests.test_report_index tests.test_report_delivery
      - name: Index complete archives and publish compact handoff
        run: python -m report_support.index
      - name: Commit and retry against the current ledger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            git add --sparse reports/latest/manifest.json reports/latest/handoff.json
            if ! git diff --cached --quiet; then
              git commit -m "reports: reconcile archive index and compact handoff"
            fi
            if [ "$(git rev-parse HEAD)" = "$base" ]; then exit 0; fi
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch --depth=1 origin main
            if git diff --quiet "$base" origin/main -- reports/archive reports/latest report_support; then
              git rebase --onto origin/main "$base"
            else
              git reset --hard origin/main
              python -m report_support.index
            fi
            base=$(git rev-parse origin/main)
          done

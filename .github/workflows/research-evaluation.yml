name: Research shadow evaluation

on:
  push:
    branches: [main]
    paths:
      - "research_system/**"
      - "market_screen/research.py"
      - "config/research_v2.json"
      - "config/early_model_dataset.json"
      - "requirements-research.txt"
      - "tests/test_research_*.py"
      - ".github/workflows/research-evaluation.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Shanghai Shenzhen BOLL screen", "Independent noon market ingestion", "Maintain public report index"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: research-shadow-main
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /market_screen/
            /research_system/
            /research_pipeline/
            /pipeline/
            /report_support/
            /tests/
            /config/
            /schemas/
            /requirements.txt
            /requirements-research.txt
            /output/boll/latest/
            /output/research/
            /output/cache/trade_calendar.json
            /reports/latest/
            /reports/archive/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-research.txt
      - name: Verify prospective research and leakage contracts
        run: python -m unittest discover -s tests -p 'test_research_*.py'
      - name: Hydrate only the current producer versions
        run: python -m research_system.runner hydrate
      - name: Update public episodes and research readiness
        run: python -m research_system.runner run
      - name: Publish against the latest state without resetting episodes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add --sparse output/research
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "research: update prospective episodes and shadow readiness"
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python -m research_system.runner hydrate
            python -m research_system.runner run
          done
          exit 1

name: Stock report data pipeline v1.6.1

on:
  push:
    branches: [main]
    paths:
      - "config/report_pools.json"
      - "config/watchlist.csv"
      - "config/quality_profiles.json"
      - "pipeline/**"
      - ".github/workflows/market-snapshot.yml"
      - "tests/**"
      - "schemas/**"
      - "scripts/fetch_snapshot.py"
  workflow_dispatch:
    inputs:
      snapshot_type:
        description: Snapshot type
        required: true
        default: early
        type: choice
        options:
          - early
          - noon
          - close
          - evening
          - intraday
      mode:
        description: Collection mode
        required: true
        default: full
        type: choice
        options:
          - full
          - light
      planned_at:
        description: Planned China time in HH:MM
        required: true
        default: "08:40"
        type: string
      attempt_role:
        description: Attempt role
        required: true
        default: manual
        type: string
      report_date:
        description: Optional China report date in YYYY-MM-DD
        required: false
        type: string
  schedule:
    - cron: "17 0 * * 1-5"
    - cron: "43 0 * * 1-5"
    - cron: "37 3 * * 1-5"
    - cron: "7 4 * * 1-5"
    - cron: "23 4 * * 1-5"
    - cron: "35 6 * * 1-5"
    - cron: "20 7 * * 1-5"
    - cron: "17 12 * * *"
    - cron: "41 12 * * *"

permissions:
  contents: write

concurrency:
  group: stock-report-data-publisher-main
  cancel-in-progress: false
  queue: max

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      planned_at: ${{ steps.params.outputs.planned_at }}
      report_date: ${{ steps.params.outputs.report_date }}
    env:
      TZ: Asia/Shanghai
      PIPELINE_QUOTE_MODE: direct
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}

    steps:
      - name: Checkout public data repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate frozen contracts
        if: github.event_name != 'schedule'
        env:
          PIPELINE_QUOTE_MODE: legacy
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Resolve schedule parameters
        id: params
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SNAPSHOT_TYPE: ${{ inputs.snapshot_type }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PLANNED_AT: ${{ inputs.planned_at }}
          INPUT_ATTEMPT_ROLE: ${{ inputs.attempt_role }}
          INPUT_REPORT_DATE: ${{ inputs.report_date }}
        run: python -m pipeline.schedule --github-output "$GITHUB_OUTPUT"

      - name: Collect, grade and publish snapshot
        id: collect
        continue-on-error: true
        timeout-minutes: 18
        shell: bash
        run: |
          args=(
            --snapshot-type "${{ steps.params.outputs.snapshot_type }}"
            --mode "${{ steps.params.outputs.mode }}"
            --planned-at "${{ steps.params.outputs.planned_at }}"
            --attempt-role "${{ steps.params.outputs.attempt_role }}"
          )
          if [[ -n "${{ steps.params.outputs.report_date }}" ]]; then
            args+=(--report-date "${{ steps.params.outputs.report_date }}")
          fi
          python -m pipeline.run "${args[@]}"

      - name: Restore missing fixed noon data
        id: noon_recovery
        if: always() && steps.params.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 4
        run: python -m pipeline.catchup

      - name: Commit one consistent publication
        if: always() && steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --cached --quiet; then
            echo "No publication changes."
            exit 0
          fi
          git commit -m "snapshot: ${{ steps.params.outputs.snapshot_type }} ${{ steps.params.outputs.planned_at }}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Surface failed collection after preserving diagnostics
        if: always() && (steps.collect.outcome == 'failure' || steps.noon_recovery.outcome == 'failure')
        run: |
          echo "::error::Collection or noon recovery failed; inspect output/health/latest_run.json and current Manifest readiness."
          exit 1

  ma5-after-publication:
    needs: publish-snapshot
    if: always() && (needs.publish-snapshot.outputs.planned_at == '14:35' || needs.publish-snapshot.outputs.planned_at == '15:20')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      PLANNED_AT: ${{ needs.publish-snapshot.outputs.planned_at }}
      REPORT_DATE: ${{ needs.publish-snapshot.outputs.report_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Independent MA5 scan
        run: |
          phase=preclose
          if [[ "$PLANNED_AT" == "15:20" ]]; then phase=close; fi
          python -m ma5_system.run --phase "$phase" --planned-at "$PLANNED_AT" --report-date "$REPORT_DATE"
      - name: Publish MA5 state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ma5
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ma5: independent scheduled scan"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

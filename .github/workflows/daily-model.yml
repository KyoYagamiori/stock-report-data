name: Daily model forward trial

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research_system/daily_model*.py"
      - "market_screen/noon_repair.py"
      - "config/daily_model.json"
      - "tests/test_research_daily_model*.py"
      - "reports/forecasts/**"
      - ".github/workflows/daily-model.yml"
  workflow_run:
    workflows: ["Shanghai Shenzhen BOLL screen"]
    types: [completed]
    branches: [main]
  schedule:
    # 08:47 and 12:17 verify forecast evidence. 15:47 is for the former-leader ledger.
    # The completed BOLL screen wakes daily scoring. 20:47 is the evening fallback.
    - cron: "47 0 * * 1-5"
    - cron: "17 4 * * 1-5"
    - cron: "47 7 * * 1-5"
    - cron: "47 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-model-forward-main
  cancel-in-progress: false

jobs:
  trial:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
      && (github.event_name != 'schedule' || github.event.schedule != '47 7 * * 1-5')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /research_system/
            /market_screen/
            /pipeline/
            /report_support/
            /tests/
            /config/
            /reports/forecasts/
            /requirements-research.txt
            /output/boll/latest/
            /output/cache/trade_calendar.json
            /output/research/daily_model/
            /output/research/latest/daily_model*.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Install model runtime
        run: python -m pip install --disable-pip-version-check -r requirements-research.txt
      - name: Verify frozen predictions, timing, own data and outcome contracts
        run: python -m unittest discover -s tests -p 'test_research_daily_model*.py'
      - name: Hydrate hash-bound historical training and current own data
        run: python -m research_system.daily_model hydrate
      - name: Register published report plans and fit the close-call calibration
        continue-on-error: true
        run: python -m research_system.daily_model_report_feedback
      - name: Review frozen VCP windows with completed minute evidence
        continue-on-error: true
        run: python -m research_system.daily_model_vcp_feedback
      - name: Score daily candidates and settle future price proxies
        id: run
        continue-on-error: true
        run: python -u -m research_system.daily_model run
      - name: Publish frozen predictions and small report reader
        id: publish
        if: always() && steps.run.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          trial_failed="${{ steps.run.outcome == 'failure' }}"
          base=$(git rev-parse HEAD)
          inputs=(config research_system market_screen pipeline report_support requirements-research.txt
                  reports/forecasts output/cache/trade_calendar.json output/boll output/history_pilot/experiments
                  output/research/daily_model ':(glob)output/research/latest/daily_model*.json')
          for attempt in 1 2 3; do
            git add --sparse output/research/daily_model output/research/latest/daily_model*.json
            if ! git diff --cached --quiet; then
              git commit -m "research: freeze daily model trial predictions and own-data feedback"
            fi
            if [ "$(git rev-parse HEAD)" = "$base" ]; then break; fi
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch --depth=1 origin main
            if git diff --quiet "$base" origin/main -- "${inputs[@]}"; then
              git rebase --onto origin/main "$base"
              base=$(git rev-parse origin/main)
              continue
            fi
            # Rebuild only when input or prediction evidence changed.
            git reset --hard origin/main
            base=$(git rev-parse HEAD)
            python -m research_system.daily_model hydrate
            if ! python -m research_system.daily_model_report_feedback; then
              echo '::warning::Forecast feedback could not be refreshed.'
            fi
            if ! python -m research_system.daily_model_vcp_feedback; then
              echo '::warning::VCP minute feedback could not be refreshed.'
            fi
            trial_status=0
            python -m research_system.daily_model run || trial_status=$?
            case "$trial_status" in
              0) trial_failed=false ;;
              2) trial_failed=true ;;
              *) exit "$trial_status" ;;
            esac
          done
          echo "trial_failed=$trial_failed" >> "$GITHUB_OUTPUT"
      - name: Surface actual trial failures
        if: steps.publish.outputs.trial_failed == 'true'
        run: exit 1

  relaunch:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'schedule'
          && (github.event.schedule == '47 7 * * 1-5' || github.event.schedule == '47 12 * * 1-5'))
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /pipeline/
            /report_support/
            /research_system/relaunch_ledger.py
            /output/cache/trade_calendar.json
            /output/research/relaunch/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Register launch signals and mature outcomes
        run: python -u -m research_system.relaunch_ledger
      - name: Publish the dated research records
        shell: bash
        run: |
          git add --sparse output/research/relaunch/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: update former-leader launch observations"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch --depth=1 origin main
            git rebase --onto origin/main HEAD^
          done
          exit 1
